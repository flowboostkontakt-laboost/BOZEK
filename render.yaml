# Blueprint wdrożenia (Render.com) — API + PWA jednym plikiem.
# Na Render: New → Blueprint → wskaż repo BOZEK → Apply.
#
# UWAGA: bazy CELOWO tu nie ma. Darmowy Postgres Rendera wygasł 4.08.2026
# i został skasowany; produkcyjna baza stoi na Neonie (konto Vercel-managed).
# Wcześniejszy wpis `fromDatabase: bozek-db` sprawiał, że każdy „Sync/Apply"
# blueprintu nadpisywał DATABASE_URL adresem martwej bazy i kładł deploy
# (ostatnio 2.09.2026).
services:
  # ─── Backend API (NestJS, Docker) ───────────────────────────────
  - type: web
    name: bozek-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      # DATABASE_URL wpisuje się RĘCZNIE w panelu (Environment): connection
      # string Neona w wersji UNPOOLED (host bez „-pooler"), z panelu Vercela
      # (Storage → baza → DATABASE_URL_UNPOOLED). `sync: false` gwarantuje,
      # że blueprint nigdy go nie nadpisze.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TZ
        value: Europe/Warsaw
      # Rozpoznawanie produktu ze zdjęcia — Google AI Studio (Gemini API).
      # AI_API_KEY jest sync:false, więc wpisuje się go RĘCZNIE w panelu Render
      # (Environment). Bez klucza moduł zgłasza się jako wyłączony i nie zgaduje.
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_EMBED_DIM
        value: "768"
      - key: AI_MATCH_THRESHOLD
        value: "0.78"
      - key: WEB_ORIGIN
        value: https://bozek-web.onrender.com
      - key: PRESTASHOP_API_URL
        sync: false
      - key: PRESTASHOP_API_KEY
        sync: false

  # ─── Frontend PWA (statyczny) ───────────────────────────────────
  - type: web
    name: bozek-web
    runtime: static
    buildCommand: npm install && npm run build -w @sep/shared && npm run build -w @sep/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://bozek-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
